[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "release-sql-bot"
version = "0.3.0"
description = "Auditable fact-level SQL template generation and review service"
readme = "README.md"
requires-python = "==3.11.9"
dependencies = [
    "fastapi>=0.139.2,<0.140",
    "httpx2>=2.9.1,<3",
    "jsonschema[format]>=4.26,<5",
    "langgraph>=1.2.9,<1.3",
    "pymongo>=4.15,<5",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.14.2,<2.15",
    "uvicorn>=0.51,<0.52",
    "sqlglot>=30.17,<30.18",
]

[project.scripts]
release-sql-bot = "release_sql_bot.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16,<0.17",
]

[tool.hatch.build.targets.wheel]
packages = ["src/release_sql_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
